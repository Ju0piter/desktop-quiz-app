services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: desktop-quiz-frontend

    restart: unless-stopped

    ports:
      - "8080:80"
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: desktop-quiz-backend

    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18
    container_name: postgres-desktop-quiz
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - desktop_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  
volumes:
  desktop_postgres_data: